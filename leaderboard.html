<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Leaderboard - OpenRad</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { slate: { 850: '#1e293b', 900: '#0f172a' }, violet: { 500: '#8b5cf6', 600: '#7c3aed' }, gold: { 400: '#fbbf24', 500: '#f59e0b' } } } } }</script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif
        }

        [x-cloak] {
            display: none
        }
    </style>
    <!-- GoatCounter Analytics -->
    <script data-goatcounter="https://davef.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>

<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 min-h-screen">
    <script src="js/app.js?v=9753cc8"></script>

    <div x-data="leaderboardApp()" x-init="init()" class="max-w-4xl mx-auto px-4 py-8">

        <div class="mb-8 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <a href="profile.html"
                    class="flex items-center gap-2 text-sm font-medium text-slate-500 hover:text-violet-600 transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                    </svg>
                    Back to Dashboard
                </a>
                <div class="h-4 w-px bg-slate-300 dark:bg-slate-700"></div>
                <a href="https://github.com/konstvr/OpenRad/issues" target="_blank" rel="noopener noreferrer"
                    class="p-2 rounded-full text-slate-400 hover:text-violet-600 transition"
                    title="Report an Issue / Contact Support">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                        <path fill-rule="evenodd" clip-rule="evenodd"
                            d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.603-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.464-1.11-1.464-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.831.092-.646.35-1.086.636-1.336-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.579.688.481C19.137 20.162 22 16.418 22 12c0-5.523-4.477-10-10-10z" />
                    </svg>
                </a>
            </div>
            <h1 class="text-3xl font-bold">🏆 Hall of Fame</h1>
        </div>

        <div
            class="bg-white dark:bg-slate-800 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-700 overflow-hidden">
            <div class="p-6 bg-slate-50 dark:bg-slate-900/50 border-b border-slate-200 dark:border-slate-700">
                <h2 class="text-lg font-bold">Top Contributors</h2>
                <p class="text-sm text-slate-500">Rankings updated in real-time.</p>
            </div>

            <table class="w-full text-left">
                <thead class="bg-slate-50 dark:bg-slate-900/30 text-xs uppercase text-slate-500 font-bold">
                    <tr>
                        <th class="px-6 py-4 w-20 text-center">Rank</th>
                        <th class="px-6 py-4">Reviewer</th>
                        <th class="px-6 py-4 text-right">Verified Models</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 dark:divide-slate-700">
                    <template x-for="(entry, index) in leaders" :key="index">
                        <tr class="hover:bg-slate-50 dark:hover:bg-slate-700/30 transition">
                            <td class="px-6 py-4 text-center">
                                <template x-if="entry.rank === 1"><span class="text-2xl">🥇</span></template>
                                <template x-if="entry.rank === 2"><span class="text-2xl">🥈</span></template>
                                <template x-if="entry.rank === 3"><span class="text-2xl">🥉</span></template>
                                <template x-if="entry.rank > 3"><span class="font-mono font-bold text-slate-400"
                                        x-text="entry.rank"></span></template>
                            </td>
                            <td class="px-6 py-4">
                                <div class="font-bold text-slate-900 dark:text-white" x-text="entry.name"></div>
                                <div class="text-xs text-slate-500" x-text="getRankTitle(entry.verified_count)"></div>
                            </td>
                            <td class="px-6 py-4 text-right font-mono font-bold text-violet-600 text-lg"
                                x-text="entry.verified_count"></td>
                        </tr>
                    </template>
                    <tr x-show="leaders.length === 0">
                        <td colspan="3" class="px-6 py-12 text-center text-slate-500">No contributions yet. Be the
                            first!</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function leaderboardApp() {
            return {
                leaders: [],
                async init() {
                    if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');

                    // Wait for auth to stabilize to prevent lock contention
                    if (window.Alpine && Alpine.store('auth')) {
                        while (Alpine.store('auth').loading) {
                            await new Promise(r => setTimeout(r, 200));
                        }
                    }

                    try {
                        let data, error;

                        // Use fallback raw fetch if LockManager timed out in app.js
                        if (window.safeFetch && window.Alpine && Alpine.store('auth')?.useRawFetch) {
                            const res = await window.safeFetch('/rest/v1/rpc/get_leaderboard', { method: 'POST' });
                            data = res.data;
                            error = res.error;
                        } else {
                            const clientToUse = window.sbRpcClient || sbClient;
                            const res = await clientToUse.rpc('get_leaderboard');
                            data = res.data;
                            error = res.error;
                        }

                        if (!error && data) {
                            this.leaders = data;
                        } else {
                            console.error("[Leaderboard] RPC Error:", error);
                        }
                    } catch (err) {
                        console.error("[Leaderboard] Exception:", err);
                    }
                },
                getRankTitle(count) {
                    if (count >= 200) return "Co-Author 🏆";
                    if (count >= 50) return "Senior Contributor ⚡";
                    return "Contributor";
                }
            }
        }
    </script>
    <footer
        class="w-full bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 mt-12 py-6 transition-colors duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col items-center justify-center gap-2">
            <div class="text-sm text-slate-500 dark:text-slate-400 text-center">
                <p>&copy; Copyright 2026 KV</p>
                <p class="mt-1">This project uses the MIT licence.</p>
                <div class="mt-2 flex gap-4 justify-center text-xs">
                    <a href="terms.html" class="hover:text-violet-500 transition">Terms & Conditions</a>
                    <a href="privacy.html" class="hover:text-violet-500 transition">Privacy Policy</a>
                </div>
            </div>
        </div>
    </footer>
</body>

</html>
